[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "week-9-rag-implementation"
version = "0.1.0"
description = "A provider-neutral retrieval baseline for the AI architecture curriculum"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
test = [
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

